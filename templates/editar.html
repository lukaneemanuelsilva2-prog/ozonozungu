<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Anúncio - KitandaDeal</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="text-white min-h-screen" style="background:#0d0d0d">

    <nav class="sticky top-0 z-30 border-b border-orange-500/40 px-6 py-3 flex justify-between items-center" style="background:#111111">
        <a href="/">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="KitandaDeal" class="h-10">
        </a>
        <div class="flex items-center gap-3">
            <a href="/logout" class="text-gray-400 hover:text-orange-500 text-sm transition">Sair</a>
        </div>
    </nav>

    <div class="max-w-2xl mx-auto py-12 px-6">
        <a href="/anuncio/{{ anuncio.id }}" class="text-gray-500 hover:text-orange-500 text-sm mb-6 inline-block">← Voltar ao anúncio</a>
        <h2 class="text-3xl font-black mb-8">Editar <span class="text-orange-500">Anúncio</span></h2>

        <form method="POST" enctype="multipart/form-data" class="flex flex-col gap-5">

            <div>
                <label class="text-gray-400 text-sm mb-1 block">Título</label>
                <input type="text" name="titulo" required value="{{ anuncio.titulo }}"
                    class="w-full border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-orange-500 transition"
                    style="background:#1a1a1a">
            </div>

            <div>
                <label class="text-gray-400 text-sm mb-1 block">Categoria</label>
                <select name="categoria" required
                    class="w-full border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-orange-500 transition"
                    style="background:#1a1a1a">
                    {% for icone, cat in categorias %}
                    <option value="{{ cat }}" {% if anuncio.categoria == cat %}selected{% endif %}>{{ icone }} {{ cat }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="text-gray-400 text-sm mb-1 block">Preço (Kz)</label>
                <input type="text" name="preco" required value="{{ anuncio.preco }}"
                    class="w-full border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-orange-500 transition"
                    style="background:#1a1a1a">
            </div>

            <div>
                <label class="text-gray-400 text-sm mb-1 block">Descrição</label>
                <textarea name="descricao" required rows="4"
                    class="w-full border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-orange-500 transition"
                    style="background:#1a1a1a">{{ anuncio.descricao }}</textarea>
            </div>

            <div>
                <label class="text-gray-400 text-sm mb-1 block">Contacto (WhatsApp ou telefone)</label>
                <input type="text" name="contacto" required value="{{ anuncio.contacto }}"
                    class="w-full border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-orange-500 transition"
                    style="background:#1a1a1a">
            </div>

            <div>
                <label class="text-gray-400 text-sm mb-1 block">Nova imagem (opcional)</label>
                {% if anuncio.imagem %}
                <img src="{{ url_for('static', filename='uploads/' + anuncio.imagem) }}" class="w-32 h-24 object-cover rounded-lg mb-2">
                {% endif %}
                <input type="file" name="imagem" accept="image/*"
                    class="w-full border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-orange-500"
                    style="background:#1a1a1a">
            </div>

            <button type="submit"
                class="bg-orange-500 text-black font-black py-3 rounded-xl hover:bg-orange-400 transition text-lg mt-2">
                Guardar alterações
            </button>
        </form>
    </div>
</body>
</html>
